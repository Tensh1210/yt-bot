[tool.ruff]
target-version = "py311"
# Existing code favors descriptive one-line statements over wrapping.
line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests import core/ and cogs/ no matter
# how pytest is invoked (bare `pytest` does not add the CWD, `python -m` does).
pythonpath = ["."]
